name: CI/CD

on:
  push:
    branches: [main, stg]
  pull_request:
    branches: [main, stg]

jobs:
  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  dbt-build:
    name: dbt build against the staging warehouse
    needs: ruff
    runs-on: ubuntu-latest
    # No `environment:` here on purpose — the staging/production GitHub Environments are
    # branch-locked (stg/main respectively, per terraform/github.tf's deployment policy) so a
    # main push can use `staging`. Real error hit: "Branch main is not allowed to deploy to
    # staging due to environment protection rules." This job always tests against the staging
    # catalog regardless of which branch triggered it — that's a credential choice, not a
    # deployment, so it uses plain repo-level secrets instead of an environment-scoped set.
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DBT_WAREHOUSE_HTTP_PATH: ${{ secrets.DBT_WAREHOUSE_HTTP_PATH }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/profiles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: cp dbt/profiles/profiles.yml.example dbt/profiles/profiles.yml
      - working-directory: dbt
        run: dbt deps
      - working-directory: dbt
        run: dbt seed --target ci --full-refresh
      - working-directory: dbt
        run: dbt build --target ci --full-refresh
      # sqlfluff is NOT run here. Real finding, not a shortcut: dbt-databricks opens a separate
      # metadata/introspection connection for a couple of models (int_customer_location_current,
      # the incremental int_order_items_enriched) that fails to authenticate — reproduced
      # consistently, in isolation, against this real warehouse, with both a personal token and
      # oauth-m2m creds. dbt build itself (above) is unaffected and is the actual correctness
      # gate. sqlfluff config stays in the repo for local, best-effort linting (see README
      # Troubleshooting) — it's just not reliable enough to block CI on.

  # stg -> staging, main -> production. Each deploy job needs a GitHub Environment of the same
  # name configured with DATABRICKS_HOST / DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET
  # secrets for a Databricks service principal (OAuth M2M) — same pattern as
  # databricks-bundle-template's ci-cd.yml.
  deploy-staging:
    name: Deploy to staging
    needs: dbt-build
    if: github.ref == 'refs/heads/stg' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t staging
      - run: databricks bundle run dbt_build -t staging

  deploy-production:
    name: Deploy to production
    needs: dbt-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
      - run: databricks bundle run dbt_build -t prod
