version: 2

models:
  - name: stg_olist__customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: stg_olist__orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_olist__customers')
              field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              values:
                [
                  "delivered",
                  "shipped",
                  "canceled",
                  "unavailable",
                  "invoiced",
                  "processing",
                  "created",
                  "approved",
                ]

  - name: stg_olist__order_items
    columns:
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_olist__products')
              field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_olist__sellers')
              field: seller_id
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_olist__orders')
              field: order_id

  - name: stg_olist__order_payments
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_olist__orders')
              field: order_id

  - name: stg_olist__order_reviews
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: review_score
        data_tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: stg_olist__products
    columns:
      - name: product_id
        data_tests: [not_null, unique]

  - name: stg_olist__sellers
    columns:
      - name: seller_id
        data_tests: [not_null, unique]

  - name: stg_olist__geolocation
    columns:
      - name: geolocation_zip_code_prefix
        data_tests: [not_null, unique]

  - name: stg_olist__product_category_translation
    columns:
      - name: product_category_name
        data_tests: [not_null, unique]
